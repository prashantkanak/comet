[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comet-ai"
version = "0.1.0"
description = "Comet AI — Complaint Orchestration & Management Engine for Triage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "email-validator>=2",
    "pydantic-settings>=2",
    "python-dotenv>=1.0",
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    "openai>=1.40",
    "google-genai>=1.0",
    "streamlit>=1.36",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
]

[tool.vercel]
entrypoint = "app:app"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "httpx>=0.27",
]

[project.scripts]
comet = "comet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "live: opt-in tests that call a real LLM (COMET_LIVE_LLM=1)",
]
