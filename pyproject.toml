[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comet-ai"
version = "0.1.0"
description = "Comet AI — Complaint Orchestration & Management Engine for Triage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "email-validator>=2",
    "pydantic-settings>=2",
    "python-dotenv>=1.0",
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[project.scripts]
comet = "comet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
